name: Build and Release
# Права на запись для создания релизов
permissions:
  contents: write
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # ручной запуск
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
        include:
          - os: ubuntu-24.04
            artifact_name: git-task-linux
          - os: windows-2025
            artifact_name: git-task-windows.exe
          - os: macos-15
            artifact_name: git-task-macos-arm64
          - os: macos-15-intel
            artifact_name: git-task-macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.76.0
          cache: false
          frozen: true
      - name: Build executable
        run: |
          pixi run build
      - name: Rename artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv git-task.exe ${{ matrix.artifact_name }}
          else
            mv git-task ${{ matrix.artifact_name }}
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
  release:
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/git-task-linux/git-task-linux
            artifacts/git-task-windows.exe/git-task-windows.exe
            artifacts/git-task-macos-arm64/git-task-macos-arm64
            artifacts/git-task-macos-intel/git-task-macos-intel
            install.sh
            install.bat
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
